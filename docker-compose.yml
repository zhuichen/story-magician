version: '3.8'

services:
  story-magician:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-magician
    restart: unless-stopped
    ports:
      - "${PORT:-3200}:3200"
    environment:
      - NODE_ENV=production
      - PORT=3200
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_MODEL=${ARK_MODEL:-doubao-seed-2-0-lite-260215}
      - VOLC_ACCESS_KEY_ID=${VOLC_ACCESS_KEY_ID}
      - VOLC_SECRET_ACCESS_KEY=${VOLC_SECRET_ACCESS_KEY}
      - ENABLE_VIDEO=${ENABLE_VIDEO:-false}
    volumes:
      - ./data:/app/.history
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - story-network

networks:
  story-network:
    driver: bridge
